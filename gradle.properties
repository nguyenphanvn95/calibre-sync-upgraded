org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# AGP 8.x defaults R.id/R.layout/etc. fields to non-final (for faster incremental builds), but
# this project has several pre-existing `switch (view.getId()) { case R.id.foo: ... }` blocks
# (CollectionFragment, ConnectionFragment, OPDSBrowserFragment) which require case labels to be
# compile-time constants. Turning this off restores the old "final int" behavior so those
# switch statements keep compiling as-is, instead of rewriting them all to if/else chains.
android.nonFinalResIds=false

