# data/id/lexicon.toml — Indonesian exception dictionary (id-ID).
#
# Rules in `rules.toml` cover the overwhelming majority of Indonesian words
# (EYD orthography is highly phonemic). This file holds only the exceptions:
#
#   route = "primary"   use these phonemes (stem-internal /e/ words that the
#                       default-/ə/ rule would misread, naturalized loanwords,
#                       function words).
#   route = "fallback"  ignore `phonemes`; the router sends the word to the
#                       EN engine (genuinely foreign words / English names).
#
# Phoneme strings are space-separated tokens that must exist in
# data/phoneme_id_map.json. No stress markers are emitted (RFC-011: stress
# is not contrastive in Indonesian).

# ── Function words where word-final `e` is schwa, not /e/ ──
[[entry]]
word = "ke"
phonemes = "k ə"
route = "primary"

# ── Stem-internal /e/ exceptions (default rule reads non-final `e` as /ə/) ──
