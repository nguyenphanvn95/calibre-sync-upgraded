# data/it/lexicon.toml — Italian exception dictionary (it-IT).
#
# Rules in `rules.toml` cover regular Italian words (penultimate stress,
# closed e/o). This file holds only the exceptions:
#
#   route = "primary"   use these phonemes — proparoxytones (stress earlier
#                       than the penult), open-vowel /ɛ ɔ/ stems, /ddz/ words,
#                       intervocalic-/z/ words, unstressed function words,
#                       naturalized loanwords.
#   route = "fallback"  ignore `phonemes`; the router sends the word to the
#                       EN engine (genuinely foreign words / English names).
#
# Phoneme strings are space-separated tokens that must exist in
# data/phoneme_id_map.json. Primary stress is `ˈ` (ID 112), placed before
# the onset of the stressed syllable. Unstressed clitics omit `ˈ`.
# Lookup happens on the lowercased, apostrophe-stripped word.

# ── Unstressed function words (clitics — no ˈ marker) ──
[[entry]]
word = "e"
phonemes = "e"
route = "primary"

