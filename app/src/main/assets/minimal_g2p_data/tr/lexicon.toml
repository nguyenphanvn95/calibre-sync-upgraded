# data/tr/lexicon.toml — Turkish exception dictionary (tr-TR).
#
# Rules in `rules.toml` cover regular Turkish words (final-syllable stress).
# This file holds only the exceptions:
#
#   route = "primary"   use these phonemes — non-final-stress words
#                       (place names with Sezer stress, initial-stressed
#                       adverbs/conjunctions/greetings, question words) and
#                       unstressed clitics/particles (no ˈ at all).
#   route = "fallback"  ignore `phonemes`; the router sends the word to the
#                       EN engine (genuinely foreign words / English names).
#
# Phoneme strings are space-separated tokens that must exist in
# data/phoneme_id_map.json. Primary stress is `ˈ` (ID 112), placed before
# the onset of the stressed syllable. Lookup happens on the Turkish-
# lowercased (İ→i, I→ı), apostrophe-stripped word.

# ── Unstressed particles & clitics (no ˈ marker) ──
# The question particle mi/mı/mu/mü and the clitics de/da/ki are written as
# separate words but are enclitic — they never carry stress.
[[entry]]
word = "mi"
phonemes = "m i"
route = "primary"

[[entry]]
word = "mı"
phonemes = "m ɯ"
route = "primary"

[[entry]]
word = "mu"
phonemes = "m u"
route = "primary"

[[entry]]
word = "mü"
phonemes = "m y"
route = "primary"

[[entry]]
word = "de"
phonemes = "d e"
route = "primary"

[[entry]]
word = "da"
phonemes = "d a"
route = "primary"

[[entry]]
word = "ki"
phonemes = "k i"
route = "primary"

[[entry]]
word = "ve"
phonemes = "v e"
route = "primary"

[[entry]]
word = "ile"
phonemes = "i l e"
route = "primary"

[[entry]]
word = "için"
phonemes = "i tʃ i n"
route = "primary"

[[entry]]
word = "gibi"
phonemes = "g i b i"
route = "primary"

[[entry]]
